<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TradeLog Pro</title>
  <style>
    body{width:320px;margin:0;padding:16px;background:#111722;color:#eef2ff;font:13px/1.5 system-ui,sans-serif}
    h1{font-size:15px;margin:0 0 8px}
    p{margin:6px 0;color:#b8c2d8}
    .status{border-radius:8px;background:#192637;padding:11px;margin-top:12px}
    .ok{color:#80edbf}.warn{color:#ffcb76}.bad{color:#ff8d9c}
    .row{display:flex;gap:8px;margin-top:10px}
    button{flex:1;border:0;border-radius:8px;padding:9px 10px;font:600 12px system-ui;cursor:pointer;background:#2b3a52;color:#e7edff}
    button.primary{background:linear-gradient(90deg,#3264ff,#754cff);color:#fff}
    .hint{font-size:11px;color:#8d9bb5;margin-top:8px}
    code{background:#0d1420;padding:1px 4px;border-radius:4px;font-size:11px}
  </style>
</head>
<body>
  <h1>TradeLog Pro</h1>
  <p id="message">Checking this tab…</p>
  <div class="status" id="status"></div>
  <div class="row">
    <button class="primary" id="test">Test screenshot</button>
  </div>
  <div class="hint">Values are typed or pasted by hand — nothing is read from the terminal.
    After updating the extension, press <code>Reload</code> in <code>chrome://extensions</code> and refresh the trading tab.</div>
  <script src="popup.js"></script>
</body>
</html>
